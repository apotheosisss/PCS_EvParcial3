[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nhanes-diabetes"
version = "0.1.0"
dependencies = [
    "kedro>=1.0.0",
    "kedro-datasets[pandas]>=3.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
]

[project.scripts]
nhanes-diabetes = "nhanes_diabetes.__main__:main"

[tool.kedro]
package_name = "nhanes_diabetes"
project_name = "nhanes-diabetes"
kedro_init_version = "1.3.1"
tools = "['Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
