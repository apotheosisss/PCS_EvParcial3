# NHANES August 2021-August 2023 raw datasets.

nhanes_diq_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/DIQ_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_demo_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/DEMO_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_bmx_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/BMX_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_ghb_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/GHB_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_glu_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/GLU_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_paq_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/PAQ_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_slq_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/SLQ_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

nhanes_bpxo_raw:
  type: pandas.GenericDataset
  filepath: data/01_raw/BPXO_L.xpt
  file_format: sas
  load_args:
    format: xport
    encoding: iso-8859-1

diabetes_thresholds:
  type: pandas.CSVDataset
  filepath: data/01_raw/umbrales_diabetes.csv

# Ingestion outputs.
ingestion_audit:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ingestion_audit.csv

nhanes_sources_summary:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/nhanes_sources_summary.csv

sqlite_ingestion_audit_status:
  type: MemoryDataset

# Feature B: datasets intermedios de limpieza y features.
nhanes_merged:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/nhanes_merged.parquet

nhanes_clean:
  type: pandas.ParquetDataset
  filepath: data/03_primary/nhanes_clean.parquet

nhanes_features:
  type: pandas.ParquetDataset
  filepath: data/04_feature/nhanes_features.parquet

# Feature B -> Feature C model input (ver docs/CONTRATO_FEATURE_B.md).
model_input:
  type: pandas.CSVDataset
  filepath: data/05_model_input/model_input.csv
  save_args:
    index: false

feature_metadata:
  type: json.JSONDataset
  filepath: data/05_model_input/feature_metadata.json

# Modeling outputs.
model_bundle:
  type: pickle.PickleDataset
  filepath: data/06_models/model.pkl

model_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/metrics.json

model_comparison:
  type: pandas.CSVDataset
  filepath: data/08_reporting/model_comparison.csv

model_predictions:
  type: pandas.CSVDataset
  filepath: data/07_model_output/predictions.csv

confusion_matrix_data:
  type: pandas.CSVDataset
  filepath: data/08_reporting/confusion_matrix.csv

feature_importance:
  type: pandas.CSVDataset
  filepath: data/08_reporting/feature_importance.csv

# In-memory datasets.
data_split:
  type: MemoryDataset

trained_models:
  type: MemoryDataset

evaluation:
  type: MemoryDataset

# Reporting outputs.
confusion_matrix_plot:
  type: matplotlib.MatplotlibDataset
  filepath: data/08_reporting/confusion_matrix.png

feature_importance_plot:
  type: matplotlib.MatplotlibDataset
  filepath: data/08_reporting/feature_importance.png
