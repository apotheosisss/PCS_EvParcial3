version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: logs/nhanes_diabetes.log
    encoding: utf-8

root:
  level: INFO
  handlers: [console]

loggers:
  kedro:
    level: INFO
    handlers: [console, file]
    propagate: false
  nhanes_diabetes:
    level: DEBUG
    handlers: [console, file]
    propagate: false
