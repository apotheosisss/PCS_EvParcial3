# DiabetesNHANES — orquestación de servicios (feature/c)
services:

  # 1) Pipeline Kedro: ejecuta ETL + modelado y produce los artefactos en data/
  kedro-etl:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: kedro run
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env.example

  # 2) API de predicción
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env.example
    depends_on:
      - kedro-etl

  # 3) Dashboard Streamlit
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env.example
    depends_on:
      - kedro-etl

  # 4) Base de datos de auditoría (Postgres opcional; el proyecto usa SQLite por defecto)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nhanes
      POSTGRES_PASSWORD: nhanes
      POSTGRES_DB: diabetes_nhanes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
