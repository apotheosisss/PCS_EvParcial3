name: CI

# Integracion continua: corre en cada push y Pull Request hacia develop/main.
# Cubre el requisito de la rubrica EFT: "workflows de integracion continua".
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # 1) Backend Python: lint + tests del pipeline Kedro y la API
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src api tests scripts || true

      - name: Run tests (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2) Frontend Next.js: instala y compila para validar el build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

  # ---------------------------------------------------------------------------
  # 3) Docker: valida que las imagenes construyen (no publica)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build (validacion)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API/ETL image
        run: docker build -f docker/Dockerfile -t nhanes-app:ci .
